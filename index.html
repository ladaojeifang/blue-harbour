<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#152632">
  <title>蓝瓷港城 · 场景漫游</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}
  </script>
</head>
<body>
  <main id="viewer" aria-label="蓝瓷港城三维查看器">
    <canvas id="city" aria-label="港城三维画面" tabindex="0"></canvas>
    <div class="shade" aria-hidden="true"></div>
    <header class="header">
      <div class="brand">
        <svg class="tile" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c2.7 0 3.5 3.4 4.8 4.7C18.1 8 22 9.3 22 12s-3.9 4-5.2 5.3C15.5 18.6 14.7 22 12 22s-3.5-3.4-4.8-4.7C5.9 16 2 14.7 2 12s3.9-4 5.2-5.3C8.5 5.4 9.3 2 12 2Z"/><circle cx="12" cy="12" r="3.3"/></svg>
        <div><h1>蓝瓷港城</h1><p>场景漫游</p></div>
      </div>
      <div class="actions">
        <select id="quality" aria-label="模型精度" title="选择模型精度" disabled>
          <option value="standard">完整场景</option>
          <option value="light">简化模型</option>
        </select>
        <button id="overview" type="button" title="俯瞰全城" disabled>俯瞰</button>
      </div>
    </header>

    <div id="loading" class="loading" role="status">
      <p id="load-text">正在载入港城</p>
      <progress id="loading-bar" aria-label="场景加载进度" max="100"></progress>
      <button id="retry" class="primary" type="button" hidden>重新载入</button>
    </div>

    <div id="aim" class="aim" aria-hidden="true" hidden></div>
    <div id="touch-controls" class="touch-controls" aria-label="步行方向" hidden>
      <button data-key="KeyW" aria-label="前进">↑</button>
      <div><button data-key="KeyA" aria-label="向左">←</button><button data-key="KeyS" aria-label="后退">↓</button><button data-key="KeyD" aria-label="向右">→</button></div>
    </div>
    <section id="panel" class="panel" aria-label="漫游控制" hidden>
      <div class="place">
        <h2 id="place-name">木栈桥</h2>
        <p id="controls-hint">空格 暂停 · 可跳到沿途地标</p>
      </div>
      <div class="transport">
        <button id="play" class="primary" type="button">暂停漫游</button>
        <button id="walk" type="button">自由行走</button>
      </div>
      <div class="route">
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="漫游进度">
        <nav id="chapters" aria-label="沿途地标"></nav>
      </div>
    </section>
  </main>
  <script type="module" src="./walk.js"></script>
</body>
</html>
